name: Copy ShawPlus to its own Cloudflare account

# Run by hand only. ShawPlus (the pharmacy ordering app, repo ShawPlus) runs today on this repo's
# Cloudflare account, and this repo is the one place that holds that account's key (CLOUDFLARE_*).
# This copies ShawPlus's D1 database "shawplus" to the pharmacy's own account (secrets SHAWPLUS_NEW_*,
# the same values as ShawPlus's CLOUDFLARE_* secrets). It only reads this account: Luck Swan's own
# database and site are not touched. The copy of the data stays inside the run and is deleted at the end.
# Afterwards run "Deploy to Cloudflare" in the ShawPlus repo to put the web app on the new account.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'พิมพ์ COPY เพื่อยืนยันการคัดลอกข้อมูล ShawPlus ไปบัญชีใหม่ของร้านยา'
        required: true
      replace:
        description: 'บัญชีใหม่มีข้อมูล ShawPlus อยู่แล้ว: ลบทิ้งแล้วคัดลอกใหม่ทั้งหมด (yes / no)'
        required: false
        default: 'no'

concurrency:
  group: shawplus-copy
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Check the confirmation and both keys
        working-directory: .
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
          OLD_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OLD_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEW_TOKEN: ${{ secrets.SHAWPLUS_NEW_API_TOKEN }}
          NEW_ACCOUNT: ${{ secrets.SHAWPLUS_NEW_ACCOUNT_ID }}
        run: |
          if [ "$(printf '%s' "$CONFIRM" | tr -d '[:space:]"'"'"'' | tr 'a-z' 'A-Z')" != "COPY" ]; then echo "::error::พิมพ์คำว่า COPY (ภาษาอังกฤษ) ในช่องแรกเพื่อยืนยัน · You typed: '$CONFIRM'"; exit 1; fi
          clean_token() { t=$(printf '%s' "$1" | tr -d '"'"'"'\r'); if printf '%s' "$t" | grep -q 'Bearer'; then t=$(printf '%s' "$t" | sed -E 's/.*Bearer[[:space:]]+([A-Za-z0-9_-]+).*/\1/'); fi; printf '%s' "$t" | tr -d '[:space:]'; }
          clean_acct() { printf '%s' "$1" | tr -d '[:space:]"' | tr 'A-F' 'a-f'; }
          for which in OLD NEW; do
            tv="${which}_TOKEN"; av="${which}_ACCOUNT"
            t=$(clean_token "${!tv}"); a=$(clean_acct "${!av}")
            name=$([ "$which" = OLD ] && echo CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID || echo SHAWPLUS_NEW_API_TOKEN/SHAWPLUS_NEW_ACCOUNT_ID)
            if ! printf '%s' "$t" | grep -Eq '^[A-Za-z0-9_-]{30,}$'; then echo "::error::The token in $name is missing or is not an API token."; exit 1; fi
            if ! printf '%s' "$a" | grep -Eq '^[0-9a-f]{32}$'; then echo "::error::The account ID in $name is missing or is not 32 characters."; exit 1; fi
            echo "::add-mask::$t"; echo "::add-mask::$a"
            echo "${which}_TOKEN=$t" >> "$GITHUB_ENV"; echo "${which}_ACCOUNT=$a" >> "$GITHUB_ENV"
          done
          [ "$(clean_acct "$OLD_ACCOUNT")" != "$(clean_acct "$NEW_ACCOUNT")" ] || { echo "::error::SHAWPLUS_NEW_ACCOUNT_ID is this repo's own account. It must be the pharmacy's new account."; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci --no-audit --no-fund

      # a config of its own that names ShawPlus's database, so nothing touches luckswan-sales
      - name: Copy the ShawPlus data out of this account (read only)
        run: |
          export CLOUDFLARE_API_TOKEN="$OLD_TOKEN" CLOUDFLARE_ACCOUNT_ID="$OLD_ACCOUNT"
          dbid() { out=$(npx wrangler d1 list --json); printf '%s' "$out" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s.slice(s.indexOf('[')));const d=l.find(x=>x.name==='shawplus');console.log(d?d.uuid:'')})"; }
          id=$(dbid)
          [ -n "$id" ] || { echo "::error::No D1 database named shawplus in this account."; exit 1; }
          printf 'name = "shawplus-copy"\ncompatibility_date = "2025-01-01"\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "shawplus"\ndatabase_id = "%s"\n' "$id" > "$RUNNER_TEMP/old.toml"
          npx wrangler d1 export shawplus --remote --config "$RUNNER_TEMP/old.toml" --output "$RUNNER_TEMP/shawplus.sql"
          echo "Rows copied, by table:"; grep -oE '^INSERT INTO "?[A-Za-z_0-9]+"?' "$RUNNER_TEMP/shawplus.sql" | sed -E 's/INSERT INTO "?([A-Za-z_0-9]+)"?/\1/' | sort | uniq -c
          grep -q '^INSERT INTO "users"' "$RUNNER_TEMP/shawplus.sql" || { echo "::error::The copy has no logins, so it is not ShawPlus's live data."; exit 1; }
          # D1 refuses statements over 100 KB; rows with a photo or a long log go in as an INSERT plus UPDATEs
          node ../.github/scripts/split-long-sql.mjs "$RUNNER_TEMP/shawplus.sql" "$RUNNER_TEMP/shawplus-split.sql"
          mv "$RUNNER_TEMP/shawplus-split.sql" "$RUNNER_TEMP/shawplus.sql"

      - name: Put the data into the pharmacy's account
        env:
          REPLACE: ${{ github.event.inputs.replace }}
        run: |
          export CLOUDFLARE_API_TOKEN="$NEW_TOKEN" CLOUDFLARE_ACCOUNT_ID="$NEW_ACCOUNT"
          dbid() { out=$(npx wrangler d1 list --json); printf '%s' "$out" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s.slice(s.indexOf('[')));const d=l.find(x=>x.name==='shawplus');console.log(d?d.uuid:'')})"; }
          toml() { printf 'name = "shawplus-copy"\ncompatibility_date = "2025-01-01"\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "shawplus"\ndatabase_id = "%s"\n' "$1" > "$RUNNER_TEMP/new.toml"; }
          q() { npx wrangler d1 execute shawplus --remote --config "$RUNNER_TEMP/new.toml" --json --command "$1" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s.slice(s.indexOf('[')));console.log(j[0].results[0].n)}catch(e){console.log('x')}})"; }
          id=$(dbid)
          if [ -n "$id" ]; then
            toml "$id"
            users=$( [ "$(q "SELECT count(*) AS n FROM sqlite_master WHERE type = 'table' AND name = 'users'")" = "1" ] && q "SELECT count(*) AS n FROM users" || echo 0 )
            if [ "$users" != "0" ] && [ "$(printf '%s' "$REPLACE" | tr -d '[:space:]' | tr 'A-Z' 'a-z')" != "yes" ]; then
              echo "::error::The pharmacy's account already has ShawPlus data ($users logins). Run again with replace = yes to wipe it and copy everything again."; exit 1
            fi
            echo "Starting the shawplus database in the pharmacy's account again"
            npx wrangler d1 delete shawplus -y --config "$RUNNER_TEMP/new.toml"
          fi
          npx wrangler d1 create shawplus
          id=$(dbid); [ -n "$id" ] || { echo "::error::Could not create the database in the pharmacy's account."; exit 1; }
          toml "$id"
          npx wrangler d1 execute shawplus --remote --config "$RUNNER_TEMP/new.toml" --file "$RUNNER_TEMP/shawplus.sql" --yes
          echo "Rows now in the pharmacy's account:"
          npx wrangler d1 execute shawplus --remote --config "$RUNNER_TEMP/new.toml" --command "SELECT k, COUNT(*) AS rows FROM state WHERE deleted = 0 GROUP BY k ORDER BY k"
          echo "### ShawPlus data copied. Next: in the ShawPlus repo run Actions → Deploy to Cloudflare." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the copy of the data
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/shawplus.sql" "$RUNNER_TEMP/shawplus-split.sql" "$RUNNER_TEMP/old.toml" "$RUNNER_TEMP/new.toml"
