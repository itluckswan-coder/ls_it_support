name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'sales-app/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions, then run this workflow again."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund

      - name: Create database if needed
        if: steps.secrets.outputs.ready == 'true'
        run: node scripts/ensure-d1.mjs

      - name: Apply database migrations
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply luckswan-sales --remote

      - name: Deploy worker and web app
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler deploy
