name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'sales-app/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions, then run this workflow again."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # tolerate stray spaces/quotes/newlines pasted into the secrets
          acct=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]"' | tr 'A-F' 'a-f')
          # accept the token itself, or the "curl … Authorization: Bearer <token>" test command Cloudflare shows after creating it
          token=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '"'"'"'\r')
          if printf '%s' "$token" | grep -q 'Bearer'; then token=$(printf '%s' "$token" | sed -E 's/.*Bearer[[:space:]]+([A-Za-z0-9_-]+).*/\1/'); fi
          token=$(printf '%s' "$token" | tr -d '[:space:]')
          if printf '%s' "$token" | grep -Eq '^[0-9a-f]{37}$'; then
            echo "::error::CLOUDFLARE_API_TOKEN looks like the Global API Key. Create an API Token instead: My Profile → API Tokens → Create Token → template \"Edit Cloudflare Workers\" + Account · D1 · Edit."
            exit 1
          fi
          if ! printf '%s' "$token" | grep -Eq '^[A-Za-z0-9_-]{30,}$'; then
            echo "::error::CLOUDFLARE_API_TOKEN is not an API token (expected one long code of letters, digits, - or _, shown only once right after creating the token). Do not paste the Token ID or name. Create a new token if you no longer have it."
            exit 1
          fi
          if ! printf '%s' "$acct" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not a Cloudflare Account ID (expected 32 hex characters, e.g. 1a2b…). Copy it from dash.cloudflare.com → Workers & Pages → Account details → Account ID (not the Zone ID, account name or email)."
            exit 1
          fi
          echo "::add-mask::$acct"
          echo "CLOUDFLARE_ACCOUNT_ID=$acct" >> "$GITHUB_ENV"
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
        working-directory: .

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund

      - name: Create database if needed
        if: steps.secrets.outputs.ready == 'true'
        run: node scripts/ensure-d1.mjs

      - name: Apply database migrations
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply luckswan-sales --remote

      - name: Deploy worker and web app
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler deploy
